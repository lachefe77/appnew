<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delay Xit Rebuild</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Delay Xit Rebuild</h1>
      <p id="status" role="status">Base local pronta para configuração.</p>
      <form id="requirement-form">
        <label for="requirement">Próximo requisito</label>
        <textarea
          id="requirement"
          rows="4"
          placeholder="Descreva uma funcionalidade legítima que deseja construir."
        ></textarea>
        <button type="submit">Salvar requisito</button>
      </form>
      <section aria-labelledby="requirements-title">
        <h2 id="requirements-title">Backlog local</h2>
        <ul id="requirements"></ul>
      </section>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
