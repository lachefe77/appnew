<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog — SMM Hub</title>
<meta name="description" content="Estratégias de crescimento, algoritmos de redes sociais, cases reais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/brand.css">
<style>
body { min-height: 100vh; }
.blog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
@media (max-width: 900px) { .blog-grid { grid-template-columns: 1fr; } }
.post-card { background: var(--bg-elev); padding: 28px 24px; transition: all .2s; cursor: pointer; display: flex; flex-direction: column; min-height: 260px; }
.post-card:hover { background: var(--bg-elev-2); }
.post-cat { font-size: 11px; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.post-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; margin: 10px 0 12px; }
.post-sum { font-size: 14px; color: var(--ink-mute); line-height: 1.5; flex: 1; }
.post-foot { font-size: 12px; color: var(--ink-dim); font-family: var(--mono); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header class="brand-topbar">
  <a href="/vitrine.html" class="brand-logo"><span class="mark">⚡</span> SMM Hub</a>
  <nav style="display: flex; gap: 24px; align-items: center; font-size: 14px; color: var(--ink-mute);">
    <a href="/vitrine.html">Vitrine</a>
    <a href="/blog.html" style="color: var(--ink);">Blog</a>
    <a href="/login.html" class="brand-btn brand-btn-ghost brand-btn-sm">Entrar</a>
  </nav>
</header>

<main class="brand-container" style="padding: 60px 24px;">
  <div class="brand-eyebrow">Conhecimento aberto</div>
  <h1 style="font-size: clamp(36px, 6vw, 56px); font-weight: 900; letter-spacing: -0.03em; margin: 8px 0 16px;">Como fazer o algoritmo trabalhar pra você.</h1>
  <p style="font-size: 18px; color: var(--ink-mute); max-width: 620px; margin-bottom: 48px; line-height: 1.6;">Técnicas, cases e análise de métricas que a gente usa internamente — publicados abertos pra quem quiser aprender.</p>

  <div id="posts" class="blog-grid"></div>
</main>

<footer style="padding: 40px 24px; border-top: 1px solid var(--border); margin-top: 60px; text-align: center;">
  <div class="brand-mono" style="color: var(--ink-dim); font-size: 12px;">
    SMM Hub Brasil · <a href="/terms.html" style="color: var(--ink-mute);">Termos</a> · <a href="/privacy.html" style="color: var(--ink-mute);">Privacidade</a>
  </div>
</footer>

<script>
function escapeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

fetch('/api/blog').then(r => r.json()).then(({ posts }) => {
  document.getElementById('posts').innerHTML = (posts || []).map(p => `
    <a href="/post.html?slug=${encodeURIComponent(p.slug)}" class="post-card">
      <span class="post-cat">${p.category || 'Growth'}</span>
      <h2 class="post-title">${escapeText(p.title)}</h2>
      <p class="post-sum">${p.meta_description || ''}</p>
      <div class="post-foot">${p.read_time_minutes || 4} min · ${p.author || 'Equipe SMM Hub'}</div>
    </a>
  `).join('');
});
</script>
<script src="/accessibility.js" defer></script>
</body>
</html>
