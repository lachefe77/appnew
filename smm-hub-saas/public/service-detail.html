<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detalhes do serviço — SMM Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/brand.css">
<style>
body { min-height: 100vh; }
.detail-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 48px; margin-top: 32px; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
.specs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 24px 0; }
.spec { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.spec .k { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.spec .v { font-size: 17px; font-weight: 700; margin-top: 4px; }
.price-box { position: sticky; top: 90px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
.price-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; }
.price-row.total { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; font-size: 20px; font-weight: 800; }
.price-row.total .v { color: var(--accent); font-family: var(--mono); }
</style>
</head>
<body>

<header class="brand-topbar">
  <a href="/vitrine.html" class="brand-logo"><span class="mark">⚡</span> SMM Hub</a>
  <a href="/" class="brand-btn brand-btn-ghost brand-btn-sm"><i class="fa-solid fa-arrow-left"></i> Vitrine</a>
</header>

<main class="brand-container" style="padding: 40px 24px 80px;">
  <div id="detail"><div style="color: var(--ink-dim);">Carregando serviço...</div></div>
</main>

<script>
function escapeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const id = new URLSearchParams(location.search).get('id');

async function load() {
  const svcRes = await fetch('/api/services').then(r => r.json());
  const s = svcRes.services.find(x => String(x.id) === String(id));
  if (!s) { document.getElementById('detail').innerHTML = `<p style="color:var(--ink-mute)">Serviço não encontrado.</p>`; return; }
  document.title = s.name + ' — SMM Hub';

  document.getElementById('detail').innerHTML = `
    <div class="detail-grid">
      <div>
        <div class="brand-eyebrow">${s.category_name}</div>
        <h1 style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 20px; line-height: 1.2;">${escapeText(s.name)}</h1>
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
          <span style="color: var(--accent); font-size: 16px;">${'★'.repeat(Math.round(s.avg_rating))}${'☆'.repeat(5 - Math.round(s.avg_rating))}</span>
          <span style="color: var(--ink-mute); font-size: 14px;">${s.review_count || 0} avaliações</span>
        </div>
        <p style="color: var(--ink-mute); font-size: 16px; line-height: 1.7;">${s.description || ''}</p>
        <div class="specs">
          <div class="spec"><div class="k">Mínimo</div><div class="v">${s.min_quantity.toLocaleString('pt-BR')}</div></div>
          <div class="spec"><div class="k">Máximo</div><div class="v">${s.max_quantity.toLocaleString('pt-BR')}</div></div>
          <div class="spec"><div class="k">Tempo médio</div><div class="v" style="font-size: 14px;">${s.avg_time}</div></div>
          <div class="spec"><div class="k">Reposição</div><div class="v" style="font-size: 14px;">${s.refill_available ? '30 dias ✓' : 'Não oferecida'}</div></div>
        </div>
      </div>

      <div class="price-box">
        <div class="brand-label">Calculadora</div>
        <input id="q" type="number" class="brand-input brand-mono" min="${s.min_quantity}" max="${s.max_quantity}" value="${s.min_quantity}" style="font-size: 20px; text-align: center;">
        <div style="margin: 20px 0;">
          <div class="price-row"><span style="color: var(--ink-mute);">Preço por 1k</span><span class="brand-mono">R$ ${(s.price_per_k_cents / 100).toFixed(2).replace('.', ',')}</span></div>
          <div class="price-row total"><span>Total</span><span class="v" id="total">—</span></div>
        </div>
        <a href="/register.html?buy=${s.id}" class="brand-btn brand-btn-solid brand-btn-block brand-btn-lg">Comprar agora →</a>
      </div>
    </div>
  `;

  const q = document.getElementById('q'), total = document.getElementById('total');
  const update = () => { const n = parseInt(q.value, 10) || 0; total.textContent = 'R$ ' + ((s.price_per_k_cents * n / 1000) / 100).toFixed(2).replace('.', ','); };
  q.addEventListener('input', update); update();
}
load();
</script>
<script src="/accessibility.js" defer></script>
</body>
</html>
