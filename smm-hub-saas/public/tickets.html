<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suporte — SMM Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/brand.css">
<style>
body { min-height: 100vh; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
.layout { display: grid; grid-template-columns: 320px 1fr; gap: 24px; margin-top: 24px; min-height: 60vh; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
.ticket-list { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 10px; max-height: 70vh; overflow-y: auto; }
.ticket-item { padding: 12px 14px; border-radius: 8px; cursor: pointer; border-bottom: 1px solid var(--border); }
.ticket-item:hover { background: var(--bg-elev-2); }
.ticket-item.active { background: var(--accent-wash); border-left: 2px solid var(--accent); padding-left: 12px; }
.ticket-item .t { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.ticket-item .m { color: var(--ink-dim); font-size: 12px; font-family: var(--mono); }
.conv { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
.conv-head { border-bottom: 1px solid var(--border); padding-bottom: 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.msg { padding: 12px 16px; border-radius: 10px; margin-bottom: 12px; max-width: 85%; }
.msg.me { background: var(--accent-wash); border: 1px solid var(--accent-line); margin-left: auto; }
.msg.staff { background: var(--bg-elev-2); border: 1px solid var(--border); }
.msg .meta { font-size: 11px; color: var(--ink-dim); margin-bottom: 6px; font-family: var(--mono); }
.msg .body { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.attachments { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.att { background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 11px; display: inline-flex; gap: 6px; align-items: center; color: var(--accent); text-decoration: none; }
.att:hover { border-color: var(--accent); }
.composer { border-top: 1px solid var(--border); padding-top: 16px; margin-top: auto; }
.composer textarea { width: 100%; min-height: 90px; resize: vertical; }
.file-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.file-pill { background: var(--bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-size: 11px; display: inline-flex; gap: 6px; align-items: center; }
.file-pill button { background: none; border: 0; color: var(--ink-dim); cursor: pointer; }
.status-pill { padding: 3px 10px; border-radius: 100px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.s-open { background: rgba(251,191,36,0.15); color: #fbbf24; }
.s-answered { background: rgba(34,197,94,0.15); color: #86efac; }
.s-closed { background: var(--bg-elev-2); color: var(--ink-dim); }
.empty-state { color: var(--ink-dim); text-align: center; padding: 60px 20px; font-size: 14px; }
</style>
<script src="/browser-session.js" defer></script></head>
<body>

<header class="brand-topbar">
  <a href="/" class="brand-logo"><span class="mark">⚡</span> SMM Hub</a>
  <a href="/" class="brand-btn brand-btn-ghost brand-btn-sm"><i class="fa-solid fa-arrow-left"></i> Painel</a>
</header>

<div class="wrap">
  <div class="brand-eyebrow">Suporte</div>
  <h1 style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 4px;">Seus chamados</h1>
  <p class="brand-sub">Respondemos em até 1 hora em horário comercial. Fora disso, até 12h.</p>

  <button class="brand-btn brand-btn-solid" style="margin-top:16px" onclick="openNew()"><i class="fa-solid fa-plus"></i> Abrir novo chamado</button>

  <div class="layout">
    <aside class="ticket-list" id="ticket-list"></aside>
    <main class="conv" id="conv">
      <div class="empty-state"><i class="fa-solid fa-inbox" style="font-size:40px;margin-bottom:12px;display:block"></i>Selecione um chamado ao lado ou abra um novo.</div>
    </main>
  </div>
</div>

<!-- Modal novo chamado -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:28px;max-width:500px;width:100%">
    <h3 class="brand-h2">Novo chamado</h3>
    <div class="brand-field"><label class="brand-label">Assunto</label><input id="new-subject" class="brand-input"></div>
    <div class="brand-field"><label class="brand-label">Prioridade</label>
      <select id="new-priority" class="brand-input"><option value="low">Baixa</option><option value="medium" selected>Normal</option><option value="high">Alta</option></select>
    </div>
    <div class="brand-field"><label class="brand-label">Mensagem</label><textarea id="new-message" class="brand-textarea" rows="4"></textarea></div>
    <div class="brand-field"><label class="brand-label">Anexos (opcional, max 3)</label><input id="new-files" type="file" multiple accept="image/*,application/pdf"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:16px">
      <button class="brand-btn brand-btn-ghost" onclick="closeNew()">Cancelar</button>
      <button class="brand-btn brand-btn-solid" onclick="submitNew()">Abrir chamado</button>
    </div>
  </div>
</div>

<script>
function escapeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const token = localStorage.getItem('smm_token');
if (!token) location.href = '/login.html';
const H = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
let currentId = null, newFilesBuffer = [];

async function api(p, o = {}) { const r = await fetch(p, { ...o, headers: { ...H, ...(o.headers || {}) } }); return r.json(); }

async function loadList() {
  const r = await api('/api/tickets');
  const el = document.getElementById('ticket-list');
  if (!r.tickets.length) { el.innerHTML = `<div class="empty-state" style="padding:30px 10px">Nenhum chamado ainda.</div>`; return; }
  el.innerHTML = r.tickets.map(t => `
    <div class="ticket-item ${t.id === currentId ? 'active' : ''}" onclick="openTicket(${t.id})">
      <div class="t">${escapeText(t.subject)}</div>
      <div class="m">#${t.id} · ${t.message_count} msgs · <span class="status-pill s-${escapeText(t.status)}">${escapeText(t.status)}</span></div>
    </div>
  `).join('');
}

async function openTicket(id) {
  currentId = id;
  await loadList();
  const r = await api('/api/tickets/' + id);
  renderConv(r.ticket, r.messages);
}

function renderConv(t, msgs) {
  const html = `
    <div class="conv-head">
      <div><h3 style="margin:0 0 4px;font-size:17px">${escapeText(t.subject)}</h3><div class="brand-mono" style="font-size:12px;color:var(--ink-dim)">#${t.id} · ${new Date(t.created_at).toLocaleString('pt-BR')}</div></div>
      <span class="status-pill s-${escapeText(t.status)}">${escapeText(t.status)}</span>
    </div>
    <div style="flex:1;overflow-y:auto;max-height:50vh" id="msgs">
      ${msgs.map(m => `
        <div class="msg ${m.is_staff ? 'staff' : 'me'}">
          <div class="meta">${m.is_staff ? '🎧 ' + m.sender_name + ' · Suporte' : m.sender_name} · ${new Date(m.created_at).toLocaleString('pt-BR')}</div>
          <div class="body">${escapeHtml(m.message)}</div>
          ${m.attachments?.length ? `<div class="attachments">${m.attachments.map(a => `<a class="att" href="/api/tickets/attachment/${a.id}" target="_blank"><i class="fa-solid fa-paperclip"></i>${escapeText(a.filename)}</a>`).join('')}</div>` : ''}
        </div>
      `).join('')}
    </div>
    <div class="composer">
      <textarea id="reply" class="brand-textarea" placeholder="Escreva sua resposta..."></textarea>
      <div class="file-pills" id="reply-files"></div>
      <div style="display:flex; gap:8px; margin-top:10px">
        <input type="file" id="reply-input" multiple accept="image/*,application/pdf" style="display:none" onchange="pickFiles(event)">
        <button class="brand-btn brand-btn-ghost" onclick="document.getElementById('reply-input').click()"><i class="fa-solid fa-paperclip"></i> Anexar</button>
        <button class="brand-btn brand-btn-solid" onclick="sendReply()" style="margin-left:auto">Enviar</button>
      </div>
    </div>`;
  document.getElementById('conv').innerHTML = html;
  newFilesBuffer = [];
}

function escapeHtml(s) { return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

async function pickFiles(e) {
  for (const f of Array.from(e.target.files).slice(0, 3)) {
    const b64 = await fileToBase64(f);
    newFilesBuffer.push({ filename: f.name, mime_type: f.type, data_base64: b64 });
  }
  document.getElementById('reply-files').innerHTML = newFilesBuffer.map((f, i) => `
    <div class="file-pill"><i class="fa-solid fa-paperclip"></i>${escapeText(f.filename)}<button onclick="removeFile(${i})">×</button></div>
  `).join('');
}
function removeFile(i) { newFilesBuffer.splice(i, 1); pickFiles({ target: { files: [] } }); }

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function sendReply() {
  const message = document.getElementById('reply').value.trim();
  if (!message) return;
  await api('/api/tickets/' + currentId + '/reply', { method: 'POST', body: JSON.stringify({ message, attachments: newFilesBuffer }) });
  openTicket(currentId);
}

function openNew() { document.getElementById('modal').style.display = 'flex'; }
function closeNew() { document.getElementById('modal').style.display = 'none'; document.getElementById('new-subject').value = ''; document.getElementById('new-message').value = ''; }

async function submitNew() {
  const subject = document.getElementById('new-subject').value.trim();
  const message = document.getElementById('new-message').value.trim();
  const priority = document.getElementById('new-priority').value;
  if (!subject || !message) { alert('Preencha assunto e mensagem.'); return; }
  const files = document.getElementById('new-files').files;
  const atts = [];
  for (const f of Array.from(files).slice(0, 3)) atts.push({ filename: f.name, mime_type: f.type, data_base64: await fileToBase64(f) });
  const r = await api('/api/tickets', { method: 'POST', body: JSON.stringify({ subject, message, priority, attachments: atts }) });
  if (r.ticket_id) { closeNew(); await loadList(); openTicket(r.ticket_id); }
}

loadList();
</script>
<script src="/accessibility.js" defer></script>
</body>
</html>
