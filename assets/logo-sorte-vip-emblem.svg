<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#E5B942"/>
      <stop offset="70%" stop-color="#CA9727"/>
      <stop offset="100%" stop-color="#8F630E"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1D24"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <filter id="goldShine">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="#0A0B0E"/>
  
  <!-- Outer Double Laurel Frame -->
  <circle cx="400" cy="340" r="185" fill="none" stroke="url(#vipGold)" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <circle cx="400" cy="340" r="195" fill="none" stroke="url(#vipGold)" stroke-width="1" opacity="0.4"/>

  <!-- Casino Chip Outer Ring -->
  <circle cx="400" cy="340" r="160" fill="url(#metalPlate)" stroke="url(#vipGold)" stroke-width="5" filter="url(#goldShine)"/>
  
  <!-- Chip Pattern notches -->
  <g stroke="url(#vipGold)" stroke-width="6" opacity="0.8">
    <line x1="400" y1="180" x2="400" y2="195"/>
    <line x1="400" y1="485" x2="400" y2="500"/>
    <line x1="240" y1="340" x2="255" y2="340"/>
    <line x1="545" y1="340" x2="560" y2="340"/>
    <line x1="287" y1="227" x2="298" y2="238"/>
    <line x1="502" y1="442" x2="513" y2="453"/>
    <line x1="287" y1="453" x2="298" y2="442"/>
    <line x1="502" y1="238" x2="513" y2="227"/>
  </g>

  <!-- Laurel Wreath Leaves (Left & Right) -->
  <!-- Left Laurel -->
  <path d="M 270 380 C 260 310 290 230 350 195 C 330 225 320 270 330 320 C 335 345 320 370 270 380 Z" fill="url(#vipGold)" opacity="0.85"/>
  <!-- Right Laurel -->
  <path d="M 530 380 C 540 310 510 230 450 195 C 470 225 480 270 470 320 C 465 345 480 370 530 380 Z" fill="url(#vipGold)" opacity="0.85"/>

  <!-- Center Card Royal Trio Fan -->
  <!-- Left card -->
  <g transform="translate(400, 340) rotate(-22) translate(-400, -340)">
    <rect x="345" y="235" width="110" height="170" rx="10" fill="#181B24" stroke="url(#vipGold)" stroke-width="2.5"/>
    <text x="360" y="265" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="url(#vipGold)">K</text>
    <text x="360" y="285" font-size="14" fill="url(#vipGold)">`</text>
  </g>
  <!-- Right card -->
  <g transform="translate(400, 340) rotate(22) translate(-400, -340)">
    <rect x="345" y="235" width="110" height="170" rx="10" fill="#181B24" stroke="url(#vipGold)" stroke-width="2.5"/>
    <text x="430" y="385" font-family="'Cinzel', serif" font-size="16" font-weight="bold" fill="url(#vipGold)">Q</text>
    <text x="430" y="365" font-size="14" fill="url(#vipGold)">f</text>
  </g>
  <!-- Center Ace Card with Lucky Horseshoe / Clover blend -->
  <g>
    <rect x="340" y="225" width="120" height="185" rx="12" fill="#0F1118" stroke="url(#vipGold)" stroke-width="3.5" filter="url(#goldShine)"/>
    <text x="355" y="255" font-family="'Cinzel', serif" font-size="20" font-weight="bold" fill="url(#vipGold)">A</text>
    <text x="355" y="275" font-size="16" fill="url(#vipGold)">c</text>
    
    <!-- Central Lucky Clover inside Ace -->
    <g transform="translate(400, 320) scale(0.9)">
      <circle cx="-14" cy="-10" r="14" fill="url(#vipGold)"/>
      <circle cx="14" cy="-10" r="14" fill="url(#vipGold)"/>
      <circle cx="-14" cy="18" r="14" fill="url(#vipGold)"/>
      <circle cx="14" cy="18" r="14" fill="url(#vipGold)"/>
      <circle cx="0" cy="4" r="8" fill="#0F1118"/>
      <!-- Lucky Star Diamond -->
      <polygon points="0,-4 3,4 0,12 -3,4" fill="url(#vipGold)"/>
      <path d="M 0 20 C 0 35 12 42 16 48 L -16 48 C -12 42 0 35 0 20 Z" fill="url(#vipGold)"/>
    </g>
  </g>

  <!-- Crown on Top of Emblem -->
  <g transform="translate(400, 145) scale(0.85)">
    <path d="M -40 20 L -50 -15 L -20 2 L 0 -25 L 20 2 L 50 -15 L 40 20 Z" fill="url(#vipGold)"/>
    <circle cx="0" cy="-28" r="5" fill="#FFE79A"/>
    <circle cx="-50" cy="-18" r="4" fill="#FFE79A"/>
    <circle cx="50" cy="-18" r="4" fill="#FFE79A"/>
  </g>

  <!-- Typography -->
  <text x="400" y="585" 
        font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
        font-size="60" 
        font-weight="900" 
        letter-spacing="16" 
        text-anchor="middle" 
        fill="url(#vipGold)">SORTE</text>

  <text x="400" y="628" 
        font-family="'Montserrat', sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#D4AF37">VIP CASINO &amp; BET</text>

  <!-- Luxury Stars -->
  <g transform="translate(400, 665)">
    <polygon points="-50,-5 -47,-1 -43,-1 -46,2 -45,6 -50,3 -55,6 -54,2 -57,-1 -53,-1" fill="url(#vipGold)"/>
    <polygon points="-25,-7 -21,-1 -15,-1 -19,3 -18,9 -25,5 -32,9 -31,3 -35,-1 -29,-1" fill="url(#vipGold)"/>
    <polygon points="0,-10 4,-2 13,-2 6,4 8,12 0,7 -8,12 -6,4 -13,-2 -4,-2" fill="url(#vipGold)"/>
    <polygon points="25,-7 29,-1 35,-1 31,3 32,9 25,5 18,9 19,3 15,-1 21,-1" fill="url(#vipGold)"/>
    <polygon points="50,-5 53,-1 57,-1 54,2 55,6 50,3 45,6 46,2 43,-1 47,-1" fill="url(#vipGold)"/>
  </g>
</svg>
