<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00794F"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="url(#darkBg)"/>
  
  <!-- Subtle background glow -->
  <circle cx="400" cy="360" r="220" fill="#D4AF37" opacity="0.06" filter="url(#goldGlow)"/>

  <!-- Outer Emblem Ring -->
  <circle cx="400" cy="350" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="400" cy="350" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Left Card (Diamond tilt) -->
  <g transform="translate(400, 350) rotate(-18) translate(-400, -350)">
    <rect x="330" y="210" width="140" height="210" rx="14" fill="#1C202B" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M 400 280 L 415 305 L 400 330 L 385 305 Z" fill="url(#goldGrad)"/>
    <text x="350" y="245" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="20" font-weight="bold" fill="url(#goldGrad)">f</text>
  </g>

  <!-- Right Card (Heart tilt) -->
  <g transform="translate(400, 350) rotate(18) translate(-400, -350)">
    <rect x="330" y="210" width="140" height="210" rx="14" fill="#1C202B" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M 400 325 C 385 305 375 290 385 275 C 395 260 405 270 400 280 C 395 270 405 260 415 275 C 425 290 415 305 400 325 Z" fill="#E63946"/>
    <text x="445" y="405" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="20" font-weight="bold" fill="#E63946">e</text>
  </g>

  <!-- Center Card (Ace of Spades & Clover hybrid) -->
  <g>
    <rect x="325" y="210" width="150" height="230" rx="16" fill="#161922" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <!-- Gold Trim Inner Card -->
    <rect x="335" y="220" width="130" height="210" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
    
    <!-- Corner A and Spade -->
    <text x="350" y="250" font-family="'Cinzel', 'Playfair Display', serif" font-size="24" font-weight="bold" fill="url(#goldGrad)">A</text>
    <path d="M 350 262 C 345 257 340 252 346 248 C 350 245 354 248 350 254 C 346 248 350 245 354 248 C 360 252 355 257 350 262 Z" fill="url(#goldGrad)"/>

    <!-- Central Spade + 4-Leaf Lucky Clover Fusion Emblem -->
    <g transform="translate(400, 325) scale(1.15)">
      <!-- Spade Base Silhouette -->
      <path d="M 0 -55 C 35 -15 65 15 35 40 C 20 52 5 45 0 35 C -5 45 -20 52 -35 40 C -65 15 -35 -15 0 -55 Z" fill="url(#goldGrad)"/>
      <!-- Stem -->
      <path d="M -6 32 C -8 50 -15 58 -22 62 L 22 62 C 15 58 8 50 6 32 Z" fill="url(#goldGrad)"/>

      <!-- Inner 4-leaf Clover cutout/accent in Emerald Gold -->
      <!-- Top leaf -->
      <circle cx="0" cy="-12" r="11" fill="#161922"/>
      <circle cx="0" cy="-12" r="9" fill="url(#emeraldGrad)"/>
      <!-- Bottom leaf -->
      <circle cx="0" cy="14" r="11" fill="#161922"/>
      <circle cx="0" cy="14" r="9" fill="url(#emeraldGrad)"/>
      <!-- Left leaf -->
      <circle cx="-13" cy="1" r="11" fill="#161922"/>
      <circle cx="-13" cy="1" r="9" fill="url(#emeraldGrad)"/>
      <!-- Right leaf -->
      <circle cx="13" cy="1" r="11" fill="#161922"/>
      <circle cx="13" cy="1" r="9" fill="url(#emeraldGrad)"/>

      <!-- Center Lucky Star -->
      <polygon points="0,-4 2,0 6,1 3,4 3,8 0,6 -3,8 -3,4 -6,1 -2,0" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Crown on Top -->
  <g transform="translate(400, 165) scale(0.9)">
    <path d="M -45 25 L -55 -10 L -22 8 L 0 -22 L 22 8 L 55 -10 L 45 25 Z" fill="url(#goldGrad)"/>
    <!-- Crown Jewels -->
    <circle cx="-55" cy="-12" r="4" fill="#00F5A0"/>
    <circle cx="0" cy="-25" r="5" fill="#E63946"/>
    <circle cx="55" cy="-12" r="4" fill="#00F5A0"/>
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="400" y="580" 
        font-family="'Cinzel', 'Montserrat', 'Trajan Pro', serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="18" 
        text-anchor="middle" 
        fill="url(#goldGrad)">SORTE</text>

  <!-- Subtitle -->
  <text x="400" y="625" 
        font-family="'Montserrat', 'Helvetica', sans-serif" 
        font-size="16" 
        font-weight="600" 
        letter-spacing="10" 
        text-anchor="middle" 
        fill="#A0AAB8">CLUB &amp; GAMING</text>

  <!-- Decorative Separators -->
  <line x1="220" y1="650" x2="350" y2="650" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>
  <polygon points="400,646 405,650 400,654 395,650" fill="url(#goldGrad)"/>
  <line x1="450" y1="650" x2="580" y2="650" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Lucky Four-Leaf Clover Bottom Mini Badges -->
  <g transform="translate(400, 690) scale(0.7)">
    <circle cx="-40" cy="0" r="3" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="5" fill="url(#emeraldGrad)"/>
    <circle cx="40" cy="0" r="3" fill="url(#goldGrad)"/>
  </g>
</svg>
