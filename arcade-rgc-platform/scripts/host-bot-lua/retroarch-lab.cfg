# Lab Host Bot — teclas no formato RetroArch (z/x/up…, NÃO KeyZ/ArrowUp)
# NÃO forçar sdl2: em alguns PCs falha e o RetroArch fecha.
# Captura = gdigrab desktop+crop (DWM), não hwnd= (hwnd crasha GL/D3D).
