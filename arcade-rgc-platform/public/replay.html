<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Replay — Arena Arcade</title>
  <style>
    body { margin:0; background:#070708; color:#e8eef7; font:15px/1.4 system-ui,sans-serif; }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    a { color:#00e5ff; }
    input,button { padding:8px; background:#1c1c20; border:1px solid #333; color:#fff; }
    button { cursor:pointer; background:#e10600; border:0; font-weight:700; }
    #timeline { width:100%; margin:12px 0; }
    #frameView { background:#121214; border:1px solid #2a2a2e; padding:12px; min-height:120px; font-family:ui-monospace,monospace; font-size:12px; }
    .summary { color:#9a958c; margin:8px 0; }
  </style>
</head>
<body>
  <main>
    <p><a href="/">← Lobby</a> · <a href="/reviews.html">Revisões</a></p>
    <h1>Replay jogável (journal)</h1>
    <p>
      <input id="mid" style="width:280px" placeholder="matchId" />
      <button id="go">Carregar</button>
      <button id="play">▶ Play</button>
      <button id="pause">Pause</button>
    </p>
    <input id="timeline" type="range" min="0" max="0" value="0" />
    <div class="summary" id="sum">Aguardando…</div>
    <div id="frameView"></div>
  </main>
  <script>
    let frames = [], timer = null, i = 0;
    const q = new URLSearchParams(location.search).get("matchId");
    if (q) mid.value = q;

    function show(idx) {
      i = idx;
      timeline.value = idx;
      const f = frames[idx];
      frameView.textContent = f ? JSON.stringify(f, null, 2) : "(vazio)";
      sum.textContent = `Frame ${idx + 1}/${frames.length}` + (f?.button != null ? ` · slot ${f.slot} btn ${f.button} val ${f.value}` : "");
    }

    async function load() {
      const id = mid.value.trim();
      if (!id) return;
      const r = await fetch("/api/replays/" + encodeURIComponent(id));
      const b = await r.json().catch(() => ({}));
      if (!r.ok) { sum.textContent = b.error || "Falha"; return; }
      const rep = b.replay || {};
      frames = rep.frames || rep.inputs || [];
      timeline.max = Math.max(0, frames.length - 1);
      sum.textContent = `Winner ${rep.winnerId || "—"} · ${frames.length} eventos · stake ${rep.stakeCents ?? "—"}`;
      show(0);
    }

    go.onclick = load;
    timeline.oninput = () => { clearInterval(timer); show(+timeline.value); };
    play.onclick = () => {
      clearInterval(timer);
      timer = setInterval(() => {
        if (i >= frames.length - 1) { clearInterval(timer); return; }
        show(i + 1);
      }, 80);
    };
    pause.onclick = () => clearInterval(timer);
    if (q) load();
  </script>
</body>
</html>
