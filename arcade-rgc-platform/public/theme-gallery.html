<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena Arcade — Galeria de 20 Temas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;700&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b0d;
    --panel: #12141a;
    --text: #e8eaef;
    --muted: #8b93a7;
    --line: #262b36;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Space Grotesk", system-ui, sans-serif; }
  .top {
    position: sticky; top: 0; z-index: 40;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 16px 22px; background: rgba(10,11,13,.92); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(10px);
  }
  .brand { font-family: Syne, sans-serif; font-weight: 800; letter-spacing: .04em; font-size: 1.15rem; }
  .brand span { color: #ff3b3b; }
  .hint { color: var(--muted); font-size: .85rem; max-width: 520px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    appearance: none; border: 1px solid var(--line); background: #1a1e27; color: var(--text);
    padding: 9px 14px; border-radius: 4px; font: 700 .8rem Barlow Condensed, sans-serif;
    letter-spacing: .06em; text-transform: uppercase; cursor: pointer; text-decoration: none;
  }
  button.primary { background: #ff3b3b; border-color: #ff3b3b; color: #fff; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px; padding: 22px;
  }
  .card {
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; min-height: 100%;
  }
  .card.selected { outline: 2px solid #ff3b3b; outline-offset: 2px; }
  .card-head {
    padding: 14px 16px 10px; display: flex; justify-content: space-between; gap: 10px; align-items: start;
  }
  .card-head h2 { margin: 0; font: 800 1.05rem Syne, sans-serif; }
  .card-head p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.35; }
  .num {
    font: 700 .75rem IBM Plex Mono, monospace; color: var(--muted);
    border: 1px solid var(--line); padding: 4px 7px; border-radius: 3px; white-space: nowrap;
  }
  .swatches { display: flex; height: 18px; }
  .swatches i { flex: 1; display: block; }
  .tabs { display: flex; gap: 4px; padding: 8px 10px 0; }
  .tabs button {
    flex: 1; padding: 7px 4px; background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font-size: .72rem;
  }
  .tabs button.on { color: var(--text); border-bottom-color: currentColor; }
  .stage {
    margin: 10px; border-radius: 4px; overflow: hidden; min-height: 220px; position: relative;
    border: 1px solid rgba(255,255,255,.06);
  }
  .stage-inner { position: absolute; inset: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .navrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .logo { font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; }
  .pill { font-size: .65rem; padding: 3px 7px; border-radius: 2px; font-weight: 700; letter-spacing: .04em; }
  .hero {
    flex: 1; display: grid; place-items: end start; padding: 14px; border-radius: 3px; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(0,0,0,.75) 10%, rgba(0,0,0,.15) 70%, transparent);
  }
  .hero > * { position: relative; z-index: 1; }
  .hero h3 { margin: 0; font-size: 1.25rem; line-height: 1.05; max-width: 12ch; }
  .hero small { opacity: .85; font-size: .7rem; }
  .cta { display: inline-block; margin-top: 8px; padding: 6px 10px; font: 700 .7rem Barlow Condensed, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .rows { display: grid; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 8px; border-radius: 3px; font-size: .72rem;
  }
  .avatar { width: 28px; height: 28px; border-radius: 2px; display: grid; place-items: center; font-weight: 800; font-size: .65rem; }
  .meta { color: inherit; opacity: .7; font-size: .65rem; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { padding: 8px; border-radius: 3px; text-align: center; }
  .stat b { display: block; font-size: 1rem; }
  .stat span { font-size: .62rem; opacity: .75; text-transform: uppercase; letter-spacing: .05em; }
  .sidebar { display: grid; grid-template-columns: 88px 1fr; gap: 8px; min-height: 180px; }
  .side { padding: 8px; border-radius: 3px; display: flex; flex-direction: column; gap: 6px; font-size: .62rem; }
  .side div { padding: 5px 6px; border-radius: 2px; }
  .mainpane { padding: 8px; border-radius: 3px; display: flex; flex-direction: column; gap: 6px; }
  .table { display: grid; gap: 4px; font-size: .65rem; }
  .tr { display: grid; grid-template-columns: 1.2fr 1fr .7fr .7fr; gap: 4px; padding: 5px 6px; border-radius: 2px; }
  .card-foot { padding: 10px 12px 14px; display: flex; gap: 8px; margin-top: auto; }
  .card-foot button { flex: 1; }
  .dock {
    position: fixed; right: 16px; bottom: 16px; z-index: 50; width: min(380px, calc(100vw - 32px));
    background: #151821; border: 1px solid var(--line); border-radius: 8px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .dock h3 { margin: 0 0 6px; font: 800 1rem Syne, sans-serif; }
  .dock p { margin: 0 0 10px; color: var(--muted); font-size: .8rem; }
  .dock .pal { display: flex; height: 28px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
  .dock .pal i { flex: 1; }
  .hidden { display: none !important; }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; padding: 14px; }
    .hint { max-width: none; }
  }
</style>
</head>
<body>
  <header class="top">
    <div>
      <div class="brand">ARENA <span>ARCADE</span> · THEME LAB</div>
      <div class="hint">20 identidades visuais autorais para vitrine, sala, perfil e admin. Inspiração distante: Steam, Epic, Garena e clientes ranked antigos — sem copiar layout. Clique em um tema para inspecionar e escolher.</div>
    </div>
    <div class="actions">
      <button type="button" id="btnClear">Limpar seleção</button>
      <button type="button" class="primary" id="btnChoose" disabled>Confirmar tema</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <aside class="dock hidden" id="dock">
    <h3 id="dockTitle">—</h3>
    <p id="dockDesc">—</p>
    <div class="pal" id="dockPal"></div>
    <div class="actions">
      <button type="button" class="primary" id="btnConfirmDock">Usar este tema no produto</button>
      <button type="button" id="btnCloseDock">Fechar</button>
    </div>
  </aside>

<script>

THEMES.length = 0;
THEMES.push(

  { id:"steam-night-forge", name:"Night Forge", pitch:"Forja noturna tipo launcher moderno: aço frio, cinza-azulado e ciano contido.", fonts:{display:"Space Grotesk",ui:"Space Grotesk"}, c:{bg:"#0e141b",panel:"#16202a",elev:"#1e2b38",text:"#e7eef6",muted:"#8aa0b5",accent:"#66c0f4",accent2:"#1b2838",line:"#2a3a4a",ok:"#5bae6c",danger:"#e05a5a"} },
  { id:"epic-void-citadel", name:"Void Citadel", pitch:"Cidadela escura com acento lima elétrica — storefront agressivo, sem roxo.", fonts:{display:"Syne",ui:"Space Grotesk"}, c:{bg:"#0b0d0c",panel:"#141816",elev:"#1c221e",text:"#f2f5f0",muted:"#8d988f",accent:"#b6ff3b",accent2:"#2a3328",line:"#2c352f",ok:"#8fd14f",danger:"#ff6b4a"} },
  { id:"garena-ember", name:"Garena Ember", pitch:"Cliente de guerra: navy denso, laranja de brasa e tipografia de combate.", fonts:{display:"Archivo Black",ui:"Barlow Condensed"}, c:{bg:"#0a1220",panel:"#122038",elev:"#1a2c4a",text:"#f7f3ec",muted:"#93a4c0",accent:"#ff7a18",accent2:"#ffd39a",line:"#243656",ok:"#4caf82",danger:"#ff4d4d"} },
  { id:"rgc-copper", name:"RGC Copper Ranked", pitch:"Espírito do ranked antigo: cobre oxidado, ouro de temporada e HUD seco.", fonts:{display:"Oswald",ui:"IBM Plex Mono"}, c:{bg:"#100e0c",panel:"#1a1612",elev:"#261f18",text:"#f0e6d8",muted:"#a89984",accent:"#c47a3a",accent2:"#e0b45a",line:"#3a3026",ok:"#7d9b5a",danger:"#d65a45"} },
  { id:"kof-blood-moon", name:"Blood Moon KOF", pitch:"Lua de sangue sobre o ringue: preto, vermelho arterial e osso.", fonts:{display:"Oswald",ui:"Barlow Condensed"}, c:{bg:"#090606",panel:"#160c0c",elev:"#241212",text:"#f6ece8",muted:"#b09898",accent:"#c4122f",accent2:"#f0d7c8",line:"#3a2020",ok:"#d4a017",danger:"#ff2a2a"} },
  { id:"sp-neon-alley", name:"São Paulo Neon Alley", pitch:"Beco paulistano: asfalto molhado, neon rosa-choque de fachada e teal de chuva.", fonts:{display:"Syne",ui:"Space Grotesk"}, c:{bg:"#0b0c10",panel:"#14161f",elev:"#1d2030",text:"#f5f2ff",muted:"#9aa0b8",accent:"#ff2d95",accent2:"#20d3c8",line:"#2b3045",ok:"#2ee6a6",danger:"#ff5e5e"} },
  { id:"crt-phosphor", name:"CRT Phosphor", pitch:"Monitor fosforescente: verde de tubo, scanline e preto absoluto.", fonts:{display:"IBM Plex Mono",ui:"IBM Plex Mono"}, c:{bg:"#020402",panel:"#071107",elev:"#0d1c0d",text:"#b6ffb0",muted:"#5f8f5a",accent:"#39ff14",accent2:"#144d12",line:"#1c331c",ok:"#39ff14",danger:"#ff4242"} },
  { id:"championship-navy", name:"Championship Navy", pitch:"Transmissão de torneio: navy de terno, ouro de medalha e branco limpo.", fonts:{display:"Oswald",ui:"Barlow Condensed"}, c:{bg:"#07111f",panel:"#0f1c33",elev:"#17304f",text:"#f7f8fb",muted:"#93a6c2",accent:"#d4af37",accent2:"#ffffff",line:"#274063",ok:"#3ecf8e",danger:"#e45757"} },
  { id:"fight-club-concrete", name:"Fight Club Concrete", pitch:"Porão de luta: concreto, fita zebrada e ferrugem.", fonts:{display:"Archivo Black",ui:"Barlow Condensed"}, c:{bg:"#161513",panel:"#22201c",elev:"#2e2b26",text:"#f2efe8",muted:"#a39e93",accent:"#f0c400",accent2:"#b54a2a",line:"#3f3b34",ok:"#8fbf4a",danger:"#ff5533"} },
  { id:"ice-arena", name:"Ice Arena", pitch:"Arena gelada: gelo azul, branco frio e aço.", fonts:{display:"Space Grotesk",ui:"Space Grotesk"}, c:{bg:"#0a141c",panel:"#122230",elev:"#1a3144",text:"#eef7ff",muted:"#8fb0c6",accent:"#7fd3ff",accent2:"#d9ecf8",line:"#27485e",ok:"#5ad0b0",danger:"#ff6d7a"} },
  { id:"desert-outlaw", name:"Desert Outlaw", pitch:"Arena sob sol duro: areia, couro e sombra.", fonts:{display:"Oswald",ui:"Barlow Condensed"}, c:{bg:"#1a140e",panel:"#271d14",elev:"#35281c",text:"#f6ead7",muted:"#b8a286",accent:"#e39b3a",accent2:"#8b5a2b",line:"#4a3a28",ok:"#9cba5a",danger:"#d94c3b"} },
  { id:"circuit-board", name:"Circuit Board", pitch:"PCB vivo: verde de placa, prata de solda e LED âmbar.", fonts:{display:"IBM Plex Mono",ui:"Space Grotesk"}, c:{bg:"#06110a",panel:"#0d1c12",elev:"#142a1b",text:"#e7f5ea",muted:"#7fa38a",accent:"#ffb000",accent2:"#9ad0aa",line:"#234530",ok:"#52d68a",danger:"#ff5c5c"} },
  { id:"vinyl-90s", name:"Vinyl 90s Cabinet", pitch:"Plástico de fliperama 90s: vermelho laminado e bege de botão.", fonts:{display:"Archivo Black",ui:"Barlow Condensed"}, c:{bg:"#1b0d10",panel:"#2a1218",elev:"#3a1a22",text:"#fff4e8",muted:"#c4a49a",accent:"#e31c25",accent2:"#e8d2b0",line:"#52232d",ok:"#5cbc6a",danger:"#ff4040"} },
  { id:"obsidian-pro", name:"Matte Obsidian Pro", pitch:"Minimalismo hardcore: preto fosco e um fio ciano.", fonts:{display:"Syne",ui:"Space Grotesk"}, c:{bg:"#050505",panel:"#0f0f0f",elev:"#171717",text:"#f2f2f2",muted:"#8a8a8a",accent:"#00e5ff",accent2:"#222222",line:"#2a2a2a",ok:"#2dd4a8",danger:"#ff4d6d"} },
  { id:"broadcast-ticker", name:"Broadcast Ticker", pitch:"Placar de TV esportiva: azul de estúdio, vermelho de urgência, branco.", fonts:{display:"Oswald",ui:"Barlow Condensed"}, c:{bg:"#041528",panel:"#0a2340",elev:"#12345a",text:"#ffffff",muted:"#9bb4d0",accent:"#ff2a2a",accent2:"#f5c518",line:"#1e4a78",ok:"#2ecc71",danger:"#ff2a2a"} },
  { id:"pixel-concrete", name:"Pixel Concrete", pitch:"Brutalismo 1-bit: cinza estrutural e acento magenta seco.", fonts:{display:"IBM Plex Mono",ui:"IBM Plex Mono"}, c:{bg:"#1c1c1c",panel:"#2a2a2a",elev:"#363636",text:"#f0f0f0",muted:"#9c9c9c",accent:"#e11d8b",accent2:"#cfcfcf",line:"#484848",ok:"#b8ff57",danger:"#ff4f4f"} },
  { id:"lantern-district", name:"Lantern District", pitch:"Distrito sob chuva: asfalto, âmbar de lanterna e noite índigo.", fonts:{display:"Syne",ui:"Space Grotesk"}, c:{bg:"#0b0f1a",panel:"#141a2b",elev:"#1d2540",text:"#f3e9d7",muted:"#9aa3bf",accent:"#ffb347",accent2:"#5b6cff",line:"#2a3350",ok:"#6fd3a0",danger:"#ff6b6b"} },
  { id:"titanium-hangar", name:"Titanium Hangar", pitch:"Hangar militar: titânio, laranja de alerta e azul de baía.", fonts:{display:"Oswald",ui:"Space Grotesk"}, c:{bg:"#12151a",panel:"#1b2129",elev:"#262e3a",text:"#eef2f7",muted:"#97a3b5",accent:"#ff6a00",accent2:"#4aa3ff",line:"#354052",ok:"#4fd18b",danger:"#ff4b4b"} },
  { id:"cerrado-horizon", name:"Cerrado Horizon", pitch:"Horizonte brasileiro: azul de fim de tarde e laranja de cerrado.", fonts:{display:"Syne",ui:"Barlow Condensed"}, c:{bg:"#0c1630",panel:"#152447",elev:"#1e3260",text:"#fff5e8",muted:"#a9b6d6",accent:"#ff7a3c",accent2:"#ffc27a",line:"#2c4478",ok:"#61d395",danger:"#ff5a5a"} }
);

const VIEWS = ["vitrine", "sala", "perfil", "admin"];
let selected = null;
const viewState = Object.fromEntries(THEMES.map(t => [t.id, "vitrine"]));

function el(tag, attrs={}, kids=[]) {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}

function paintStage(theme, view) {
  const c = theme.c;
  const stage = el("div", { class: "stage", style: { background: c.bg, color: c.text, fontFamily: theme.fonts.ui + ", sans-serif" } });
  const inner = el("div", { class: "stage-inner" });

  if (view === "vitrine") {
    inner.append(
      el("div", { class: "navrow" }, [
        el("div", { class: "logo", style: { fontFamily: theme.fonts.display + ", sans-serif", color: c.accent } }, "ARENA ARCADE"),
        el("div", { class: "pill", style: { background: c.elev, color: c.accent2 || c.text, border: "1px solid " + c.line } }, "KOF 2002 ONLINE")
      ]),
      el("div", { class: "hero", style: { background: `linear-gradient(135deg, ${c.elev}, ${c.panel} 40%, ${c.accent}55)` } }, [
        el("div", {}, [
          el("small", {}, "DUELA · APOSTA · DOMINA"),
          el("h3", { style: { fontFamily: theme.fonts.display + ", sans-serif" } }, "King of Fighters 2002"),
          el("div", { class: "cta", style: { background: c.accent, color: "#0a0a0a" } }, "ENTRAR NA ARENA")
        ])
      ]),
      el("div", { class: "rows" }, [
        row(c, "SE", "Sala Sudeste", "12 online · stake R$5"),
        row(c, "NE", "Sala Nordeste", "4 online · grátis")
      ])
    );
  }

  if (view === "sala") {
    inner.append(
      el("div", { class: "navrow" }, [
        el("div", { class: "logo", style: { fontFamily: theme.fonts.display + ", sans-serif" } }, "SALA · KOF SE"),
        el("div", { class: "pill", style: { background: c.accent, color: "#111" } }, "FILA #2")
      ]),
      el("div", { class: "statgrid" }, [
        stat(c, "P1", "Você"),
        stat(c, "vs", "BO3"),
        stat(c, "P2", "Aguardando")
      ]),
      el("div", { class: "rows" }, [
        row(c, "01", "Player_Alpha", "ELO 1420 · VIP"),
        row(c, "02", "Player_Beta", "ELO 1388 · na fila"),
        row(c, "03", "Player_Gamma", "ELO 1510 · espectando")
      ]),
      el("div", { class: "cta", style: { background: c.elev, color: c.text, border: "1px solid " + c.line, alignSelf: "start" } }, "CÓDIGO CONVITE · KOF-7X2Q")
    );
  }

  if (view === "perfil") {
    inner.append(
      el("div", { class: "navrow" }, [
        el("div", { class: "logo", style: { fontFamily: theme.fonts.display + ", sans-serif" } }, "PERFIL"),
        el("div", { class: "pill", style: { background: c.ok, color: "#06210f" } }, "RANKED")
      ]),
      el("div", { class: "row", style: { background: c.panel, border: "1px solid " + c.line } }, [
        el("div", { class: "avatar", style: { background: c.accent, color: "#111" } }, "AK"),
        el("div", {}, [el("div", {}, "Akira_77"), el("div", { class: "meta" }, "Estilo: Agressor · Season 01")]),
        el("div", { style: { color: c.accent2 || c.accent, fontWeight: 800 } }, "1542")
      ]),
      el("div", { class: "statgrid" }, [
        stat(c, "128", "Vitórias"),
        stat(c, "74", "Derrotas"),
        stat(c, "63%", "WR")
      ]),
      el("div", { class: "rows" }, [
        row(c, "W", "vs Nova_Pulse", "+18 ELO · BO5"),
        row(c, "L", "vs RedCabinet", "-12 ELO · rage-quit rival")
      ])
    );
  }

  if (view === "admin") {
    inner.append(
      el("div", { class: "sidebar" }, [
        el("div", { class: "side", style: { background: c.panel, border: "1px solid " + c.line } }, [
          el("div", { style: { background: c.accent, color: "#111", fontWeight: 800 } }, "MASTER"),
          el("div", { style: { background: c.elev } }, "Overview"),
          el("div", { style: { background: c.elev } }, "Auditoria"),
          el("div", { style: { background: c.elev } }, "Saques"),
          el("div", { style: { background: c.elev } }, "Season")
        ]),
        el("div", { class: "mainpane", style: { background: c.elev, border: "1px solid " + c.line } }, [
          el("div", { style: { fontFamily: theme.fonts.display + ", sans-serif", fontWeight: 800 } }, "PAINEL OPERACIONAL"),
          el("div", { class: "table" }, [
            tr(c, true, "Usuário", "Ação", "Sala", "Quando"),
            tr(c, false, "akira_77", "JOIN_ROOM", "KOF-SE", "12:01"),
            tr(c, false, "nova", "MATCH_WIN", "KOF-SE", "12:14"),
            tr(c, false, "mod_01", "REVIEW", "—", "12:20")
          ])
        ])
      ])
    );
  }

  stage.append(inner);
  return stage;
}

function row(c, a, title, meta) {
  return el("div", { class: "row", style: { background: c.panel, border: "1px solid " + c.line } }, [
    el("div", { class: "avatar", style: { background: c.elev, color: c.accent } }, a),
    el("div", {}, [el("div", {}, title), el("div", { class: "meta" }, meta)]),
    el("div", { style: { color: c.accent, fontWeight: 700, fontSize: ".65rem" } }, "•")
  ]);
}
function stat(c, v, l) {
  return el("div", { class: "stat", style: { background: c.panel, border: "1px solid " + c.line } }, [
    el("b", { style: { color: c.accent } }, v), el("span", {}, l)
  ]);
}
function tr(c, head, ...cells) {
  return el("div", { class: "tr", style: { background: head ? c.panel : "transparent", color: head ? c.muted : c.text, fontWeight: head ? 700 : 500 } }, cells.map(x => el("div", {}, x)));
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  THEMES.forEach((theme, i) => {
    const view = viewState[theme.id];
    const card = el("article", { class: "card" + (selected === theme.id ? " selected" : ""), "data-id": theme.id });
    const head = el("div", { class: "card-head" }, [
      el("div", {}, [
        el("h2", {}, theme.name),
        el("p", {}, theme.pitch)
      ]),
      el("div", { class: "num" }, String(i + 1).padStart(2, "0"))
    ]);
    const sw = el("div", { class: "swatches" }, [theme.c.bg, theme.c.panel, theme.c.elev, theme.c.accent, theme.c.accent2, theme.c.ok].map(color => el("i", { style: { background: color } })));
    const tabs = el("div", { class: "tabs" }, VIEWS.map(v => el("button", {
      type: "button",
      class: view === v ? "on" : "",
      style: { color: view === v ? theme.c.accent : undefined },
      onClick: (e) => { e.stopPropagation(); viewState[theme.id] = v; render(); openDock(theme); }
    }, v)));
    const foot = el("div", { class: "card-foot" }, [
      el("button", { type: "button", onClick: (e) => { e.stopPropagation(); selectTheme(theme); } }, "Selecionar"),
      el("button", { type: "button", class: "primary", style: { background: theme.c.accent, borderColor: theme.c.accent, color: "#111" }, onClick: (e) => { e.stopPropagation(); selectTheme(theme); confirmTheme(); } }, "Usar este")
    ]);
    card.append(head, sw, tabs, paintStage(theme, view), foot);
    card.addEventListener("click", () => selectTheme(theme));
    grid.append(card);
  });
}

function selectTheme(theme) {
  selected = theme.id;
  openDock(theme);
  render();
  document.getElementById("btnChoose").disabled = false;
  localStorage.setItem("arena.theme.preview", theme.id);
}

function openDock(theme) {
  const dock = document.getElementById("dock");
  dock.classList.remove("hidden");
  document.getElementById("dockTitle").textContent = theme.name;
  document.getElementById("dockDesc").textContent = theme.pitch + " · fontes " + theme.fonts.display + " / " + theme.fonts.ui;
  const pal = document.getElementById("dockPal");
  pal.innerHTML = "";
  [theme.c.bg, theme.c.panel, theme.c.elev, theme.c.accent, theme.c.accent2, theme.c.ok, theme.c.danger].forEach(color => {
    pal.append(el("i", { style: { background: color }, title: color }));
  });
}

function confirmTheme() {
  if (!selected) return;
  localStorage.setItem("arena.theme", selected);
  const theme = THEMES.find(t => t.id === selected);
  alert("Tema escolhido: " + theme.name + "\\n\\nID salvo: " + selected + "\\n\\nNa próxima etapa o produto aplica este tema (CSS variables). Diga no chat qual número/ID você quer oficial.");
}

document.getElementById("btnClear").onclick = () => {
  selected = null;
  localStorage.removeItem("arena.theme.preview");
  document.getElementById("btnChoose").disabled = true;
  document.getElementById("dock").classList.add("hidden");
  render();
};
document.getElementById("btnChoose").onclick = confirmTheme;
document.getElementById("btnConfirmDock").onclick = confirmTheme;
document.getElementById("btnCloseDock").onclick = () => document.getElementById("dock").classList.add("hidden");

const saved = localStorage.getItem("arena.theme") || localStorage.getItem("arena.theme.preview");
if (saved && THEMES.some(t => t.id === saved)) selected = saved;
render();
if (selected) openDock(THEMES.find(t => t.id === selected));
</script>
</body>
</html>
