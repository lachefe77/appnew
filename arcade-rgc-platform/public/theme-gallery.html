<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arena Arcade — Catálogo de 25 Temas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --shell-bg: #060708;
    --shell-panel: #101214;
    --shell-text: #ece8e1;
    --shell-muted: #8e8a82;
    --shell-line: #26282c;
    --shell-accent: #e10600;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--shell-bg); color: var(--shell-text);
    font-family: "Barlow Condensed", sans-serif;
  }
  body {
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(225,6,0,.18), transparent 55%),
      radial-gradient(700px 400px at 100% 0%, rgba(245,197,24,.08), transparent 50%),
      var(--shell-bg);
  }
  .shell-top {
    position: sticky; top: 0; z-index: 60;
    display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end;
    padding: 18px 22px 14px;
    background: rgba(6,7,8,.92); border-bottom: 1px solid var(--shell-line);
    backdrop-filter: blur(14px);
  }
  .shell-brand {
    font-family: Oswald, sans-serif; font-weight: 700; letter-spacing: .06em;
    font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1;
  }
  .shell-brand em { font-style: normal; color: var(--shell-accent); }
  .shell-sub { margin: 6px 0 0; color: var(--shell-muted); font-size: .92rem; max-width: 62ch; line-height: 1.35; }
  .shell-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    appearance: none; border: 1px solid var(--shell-line); background: #181a1e; color: var(--shell-text);
    padding: 10px 14px; font: 700 .82rem Barlow Condensed, sans-serif;
    letter-spacing: .07em; text-transform: uppercase; cursor: pointer; text-decoration: none;
  }
  .btn.primary { background: var(--shell-accent); border-color: var(--shell-accent); color: #fff; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .layout {
    display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 96px);
  }
  .rail {
    border-right: 1px solid var(--shell-line); background: rgba(10,11,12,.85);
    overflow: auto; max-height: calc(100vh - 96px); position: sticky; top: 96px;
  }
  .rail h2 {
    margin: 0; padding: 14px 14px 8px; font: 700 .72rem IBM Plex Mono, monospace;
    letter-spacing: .12em; text-transform: uppercase; color: var(--shell-muted);
  }
  .theme-item {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center;
    width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--shell-line);
    background: transparent; color: inherit; padding: 12px 14px; cursor: pointer;
    font: inherit;
  }
  .theme-item:hover { background: rgba(255,255,255,.03); }
  .theme-item.on { background: rgba(225,6,0,.12); box-shadow: inset 3px 0 0 var(--shell-accent); }
  .theme-item .n { font: 600 .7rem IBM Plex Mono, monospace; color: var(--shell-muted); }
  .theme-item .nm { font: 700 1rem Oswald, sans-serif; letter-spacing: .03em; }
  .theme-item .fm { color: var(--shell-muted); font-size: .78rem; }
  .swatch-row { display: flex; height: 10px; width: 54px; overflow: hidden; border: 1px solid var(--shell-line); }
  .swatch-row i { flex: 1; }
  .stage-wrap { padding: 18px 20px 40px; min-width: 0; }
  .stage-head {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: end;
    margin-bottom: 14px;
  }
  .stage-head h1 { margin: 0; font: 700 clamp(1.4rem, 2.5vw, 2rem) Oswald, sans-serif; letter-spacing: .04em; }
  .stage-head p { margin: 4px 0 0; color: var(--shell-muted); max-width: 56ch; line-height: 1.35; }
  .surfaces { display: flex; flex-wrap: wrap; gap: 6px; }
  .surfaces button {
    border: 1px solid var(--shell-line); background: #141618; color: var(--shell-muted);
    padding: 8px 11px; cursor: pointer; font: 700 .75rem Barlow Condensed, sans-serif;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .surfaces button.on { color: #fff; border-color: var(--shell-accent); background: #1c1010; }
  .preview-frame {
    border: 1px solid var(--shell-line); min-height: 620px; position: relative; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .preview-chrome {
    display: flex; gap: 6px; align-items: center; padding: 8px 12px;
    background: rgba(0,0,0,.35); border-bottom: 1px solid rgba(255,255,255,.06);
    font: 600 .72rem IBM Plex Mono, monospace; letter-spacing: .04em;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
  .preview-body { position: relative; min-height: 580px; overflow: hidden; }
  .meta-bar {
    margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .meta-card {
    border: 1px solid var(--shell-line); background: rgba(16,18,20,.9); padding: 12px;
  }
  .meta-card b { display: block; font: 700 .7rem IBM Plex Mono, monospace; color: var(--shell-muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .meta-card span { font: 700 1rem Oswald, sans-serif; }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .rail { position: static; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--shell-line); }
    .meta-bar { grid-template-columns: 1fr 1fr; }
  }

  /* —— Preview internals (theme-driven) —— */
  .pv { position: absolute; inset: 0; display: flex; flex-direction: column; color: var(--t-text); font-family: var(--t-ui), sans-serif; }
  .pv-nav {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--t-line); background: color-mix(in srgb, var(--t-panel) 92%, transparent);
  }
  .pv-logo {
    font-family: var(--t-display), sans-serif; font-weight: 800; letter-spacing: .08em;
    font-size: 1.15rem; color: var(--t-accent); text-transform: uppercase;
  }
  .pv-links { display: flex; gap: 10px; flex-wrap: wrap; font-size: .82rem; color: var(--t-muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .pv-links span.on { color: var(--t-text); }
  .pv-main { flex: 1; position: relative; overflow: auto; }

  /* atmospheres */
  .atm-radial-cabinet { background: radial-gradient(1000px 500px at 20% -20%, color-mix(in srgb, var(--t-accent) 35%, transparent), transparent 55%), radial-gradient(800px 400px at 90% 10%, color-mix(in srgb, var(--t-accent2) 18%, transparent), transparent), var(--t-bg); }
  .atm-grain-warm { background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--t-accent) 22%, transparent), transparent 45%), var(--t-bg); }
  .atm-scan-navy { background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 3px), radial-gradient(900px 500px at 70% 0%, color-mix(in srgb, var(--t-accent) 20%, transparent), transparent), var(--t-bg); }
  .atm-mesh-cool { background: linear-gradient(160deg, color-mix(in srgb, var(--t-elev) 80%, #000), var(--t-bg)), var(--t-bg); }
  .atm-volt-grid { background: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px) 0 0 / 28px 28px, radial-gradient(700px 400px at 80% 20%, color-mix(in srgb, var(--t-accent) 25%, transparent), transparent), var(--t-bg); }
  .atm-mesh-green { background: radial-gradient(600px 400px at 10% 80%, color-mix(in srgb, var(--t-accent) 18%, transparent), transparent), var(--t-bg); }
  .atm-blood-vignette { background: radial-gradient(ellipse at center, var(--t-panel) 0%, var(--t-bg) 70%), var(--t-bg); }
  .atm-scanline-green { background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.35) 3px, rgba(0,0,0,.35) 4px), var(--t-bg); }
  .atm-broadcast-glow { background: radial-gradient(800px 300px at 50% 0%, color-mix(in srgb, var(--t-accent) 25%, transparent), transparent), var(--t-bg); }
  .atm-concrete-noise { background: linear-gradient(180deg, var(--t-panel), var(--t-bg)); }
  .atm-frost { background: radial-gradient(700px 500px at 80% 0%, color-mix(in srgb, var(--t-accent) 22%, transparent), transparent), var(--t-bg); }
  .atm-heat-haze { background: radial-gradient(900px 400px at 50% 100%, color-mix(in srgb, var(--t-accent) 28%, transparent), transparent), var(--t-bg); }
  .atm-pcb { background: linear-gradient(90deg, transparent 49%, color-mix(in srgb, var(--t-line) 80%, transparent) 50%, transparent 51%) 0 0 / 40px 40px, var(--t-bg); }
  .atm-vinyl-shine { background: linear-gradient(120deg, color-mix(in srgb, var(--t-accent) 30%, transparent), transparent 40%), var(--t-bg); }
  .atm-matte { background: var(--t-bg); }
  .atm-ticker { background: linear-gradient(180deg, color-mix(in srgb, var(--t-elev) 90%, #000), var(--t-bg)); }
  .atm-rain-amber { background: radial-gradient(600px 400px at 20% 30%, color-mix(in srgb, var(--t-accent) 20%, transparent), transparent), var(--t-bg); }
  .atm-hangar { background: linear-gradient(180deg, var(--t-panel), var(--t-bg)); }
  .atm-horizon { background: linear-gradient(180deg, color-mix(in srgb, var(--t-accent) 25%, var(--t-bg)) 0%, var(--t-bg) 45%); }
  .atm-operator { background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,.02) 40px, rgba(255,255,255,.02) 41px), var(--t-bg); }
  .atm-velvet-gold { background: radial-gradient(500px 300px at 50% 0%, color-mix(in srgb, var(--t-accent) 22%, transparent), transparent), var(--t-bg); }
  .atm-canopy { background: radial-gradient(800px 500px at 0% 100%, color-mix(in srgb, var(--t-accent2) 35%, transparent), transparent), var(--t-bg); }
  .atm-subway { background: linear-gradient(90deg, color-mix(in srgb, var(--t-accent2) 20%, transparent), transparent 40%), var(--t-bg); }
  .atm-thermal { background: radial-gradient(circle at 70% 40%, color-mix(in srgb, var(--t-accent) 30%, transparent), transparent 50%), var(--t-bg); }
  .atm-league { background: linear-gradient(160deg, var(--t-panel), var(--t-bg)); }

  /* auth */
  .auth-wrap { flex: 1; display: grid; place-items: center; padding: 28px 16px; }
  .auth-card {
    width: min(400px, 100%); padding: 28px 24px; background: color-mix(in srgb, var(--t-panel) 94%, transparent);
    border: 1px solid var(--t-line); box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .auth-card h2 { margin: 0 0 6px; font: 800 1.6rem var(--t-display), sans-serif; letter-spacing: .04em; }
  .auth-card .muted { color: var(--t-muted); font-size: .9rem; margin-bottom: 18px; line-height: 1.35; }
  .field { display: grid; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--t-muted); font-weight: 700; }
  .field input {
    height: 42px; padding: 0 12px; background: var(--t-bg); border: 1px solid var(--t-line);
    color: var(--t-text); font: inherit;
  }
  .auth-cta {
    width: 100%; margin-top: 8px; height: 44px; border: 0; cursor: pointer;
    background: var(--t-accent); color: #0a0a0a; font: 800 .9rem var(--t-ui), sans-serif;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .auth-alt { margin-top: 12px; font-size: .85rem; color: var(--t-muted); }
  .auth-alt b { color: var(--t-accent2); }

  /* vitrine hero */
  .hero {
    position: relative; min-height: 420px; display: grid; align-content: end;
    padding: 36px 28px 28px; overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background:
      linear-gradient(100deg, color-mix(in srgb, var(--t-bg) 92%, #000) 8%, transparent 58%),
      linear-gradient(0deg, var(--t-bg) 5%, transparent 55%);
    z-index: 1;
  }
  .fighters {
    position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end;
    gap: 8px; padding: 0 18px 0 35%; z-index: 0; pointer-events: none;
  }
  .fighter {
    width: 86px; height: 260px; position: relative;
    transform-origin: 50% 100%;
    animation: idle 2.8s ease-in-out infinite;
  }
  .fighter:nth-child(2) { animation-delay: .35s; height: 280px; width: 92px; }
  .fighter:nth-child(3) { animation-delay: .7s; height: 250px; }
  .fighter:nth-child(4) { animation-delay: 1.05s; height: 270px; width: 90px; }
  .fighter:nth-child(5) { animation-delay: 1.4s; height: 255px; }
  @keyframes idle {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50% { transform: translateY(-6px) scaleY(1.015); }
  }
  .fighter .body {
    position: absolute; inset: 18% 18% 8%; border-radius: 40% 40% 18% 18% / 30% 30% 40% 40%;
    background: linear-gradient(180deg, var(--f1), var(--f2));
    box-shadow: 0 0 40px color-mix(in srgb, var(--f1) 45%, transparent);
  }
  .fighter .head {
    position: absolute; top: 6%; left: 50%; width: 42%; aspect-ratio: 1; border-radius: 50%;
    transform: translateX(-50%);
    background: linear-gradient(160deg, var(--f1), var(--f2));
    box-shadow: 0 0 20px color-mix(in srgb, var(--f1) 50%, transparent);
  }
  .fighter .tag {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    font: 800 .62rem var(--t-display), sans-serif; letter-spacing: .08em; color: var(--t-text);
    text-shadow: 0 2px 8px #000; white-space: nowrap;
  }
  .hero-copy { position: relative; z-index: 2; max-width: 34ch; }
  .hero-copy .eyebrow {
    font: 700 .75rem IBM Plex Mono, monospace; letter-spacing: .16em; text-transform: uppercase;
    color: var(--t-accent2); margin-bottom: 10px;
  }
  .hero-copy h2 {
    margin: 0; font: 800 clamp(2rem, 4vw, 3.1rem) var(--t-display), sans-serif;
    letter-spacing: .03em; line-height: .95; text-transform: uppercase;
  }
  .hero-copy p { margin: 12px 0 0; color: var(--t-muted); font-size: 1.02rem; line-height: 1.4; max-width: 36ch; }
  .hero-ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .hero-ctas button {
    border: 0; padding: 12px 18px; cursor: pointer; font: 800 .85rem var(--t-ui), sans-serif;
    letter-spacing: .1em; text-transform: uppercase;
  }
  .hero-ctas .primary { background: var(--t-accent); color: #0a0a0a; }
  .hero-ctas .ghost { background: transparent; color: var(--t-text); border: 1px solid var(--t-line); }

  .strip {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    border-top: 1px solid var(--t-line); background: var(--t-panel);
  }
  .strip article { padding: 16px 18px; border-right: 1px solid var(--t-line); }
  .strip article:last-child { border-right: 0; }
  .strip .idx { font: 700 .68rem IBM Plex Mono, monospace; color: var(--t-accent); letter-spacing: .1em; }
  .strip h3 { margin: 6px 0 4px; font: 800 1.05rem var(--t-display), sans-serif; letter-spacing: .03em; }
  .strip p { margin: 0; color: var(--t-muted); font-size: .88rem; line-height: 1.35; }

  /* rooms / clans / admin shared */
  .pane { padding: 16px 18px; display: grid; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: 1.1fr .9fr; gap: 12px; }
  .box { background: var(--t-panel); border: 1px solid var(--t-line); padding: 14px; }
  .box h3 { margin: 0 0 10px; font: 800 1rem var(--t-display), sans-serif; letter-spacing: .04em; }
  .row {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center;
    padding: 9px 8px; border-bottom: 1px solid var(--t-line); font-size: .9rem;
  }
  .av {
    width: 36px; height: 36px; display: grid; place-items: center;
    background: var(--t-elev); color: var(--t-accent); font-weight: 800; font-size: .72rem;
  }
  .pill {
    font: 700 .68rem var(--t-ui), sans-serif; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 8px; background: var(--t-elev); border: 1px solid var(--t-line); color: var(--t-accent2);
  }
  .form-row { display: grid; gap: 6px; margin-bottom: 10px; }
  .form-row select, .form-row input {
    height: 40px; background: var(--t-bg); border: 1px solid var(--t-line); color: var(--t-text);
    padding: 0 10px; font: inherit;
  }
  .admin-shell { display: grid; grid-template-columns: 160px 1fr; min-height: 520px; }
  .admin-side { background: var(--t-panel); border-right: 1px solid var(--t-line); padding: 12px; display: grid; gap: 6px; align-content: start; }
  .admin-side div { padding: 8px 10px; font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--t-muted); background: var(--t-elev); }
  .admin-side div.on { background: var(--t-accent); color: #111; }
  .admin-main { padding: 16px; }
  .table { display: grid; gap: 4px; font-size: .82rem; }
  .tr { display: grid; grid-template-columns: 1.2fr 1fr .8fr .7fr; gap: 6px; padding: 8px; background: var(--t-panel); border: 1px solid var(--t-line); }
  .tr.head { color: var(--t-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: .7rem; }

  /* Lobby chat (3 colunas) */
  .lobby3 {
    flex: 1; display: grid; grid-template-columns: 200px 1fr 210px; min-height: 520px;
    border-top: 1px solid var(--t-line);
  }
  .lobby3-col { display: flex; flex-direction: column; min-height: 0; background: var(--t-panel); }
  .lobby3-col + .lobby3-col { border-left: 1px solid var(--t-line); }
  .lobby3-head {
    padding: 10px 12px; border-bottom: 1px solid var(--t-line);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: .78rem; font-weight: 700;
  }
  .lobby3-scroll { flex: 1; overflow: auto; padding: 8px; }
  .room-item {
    padding: 8px; margin-bottom: 6px; border: 1px solid var(--t-line); background: var(--t-elev);
    font-size: .78rem;
  }
  .room-item.on { border-color: var(--t-accent); box-shadow: inset 3px 0 0 var(--t-accent); }
  .chat-toolbar {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px;
    border-bottom: 1px solid var(--t-line); background: var(--t-bg); font-size: .7rem;
  }
  .chat-toolbar button {
    border: 1px solid var(--t-line); background: var(--t-elev); color: var(--t-text);
    padding: 4px 8px; font: 700 .68rem var(--t-ui), sans-serif; cursor: default;
  }
  .chat-msg {
    margin: 0 0 8px; padding: 8px 10px; font-size: .8rem; line-height: 1.35;
    background: var(--t-elev); border-left: 3px solid var(--t-line);
  }
  .chat-msg.sys { border-left-color: var(--t-accent); background: color-mix(in srgb, var(--t-accent) 10%, var(--t-elev)); }
  .chat-msg .who { font-weight: 800; color: var(--t-accent2); margin-right: 6px; }
  .chat-msg .when { color: var(--t-muted); font-size: .68rem; font-family: var(--t-mono), monospace; }
  .chat-input-row {
    display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--t-line); background: var(--t-panel);
  }
  .chat-input-row input {
    flex: 1; height: 36px; background: var(--t-bg); border: 1px solid var(--t-line);
    color: var(--t-text); padding: 0 10px; font: inherit;
  }
  .chat-input-row button {
    border: 0; background: var(--t-accent); color: #0a0a0a; font: 800 .75rem var(--t-ui), sans-serif;
    letter-spacing: .08em; padding: 0 12px; text-transform: uppercase;
  }

  @media (max-width: 720px) {
    .grid2, .admin-shell, .strip, .lobby3 { grid-template-columns: 1fr; }
    .fighters { padding-left: 10%; opacity: .55; }
    .fighter { width: 56px; height: 180px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fighter { animation: none !important; }
  }
</style>
</head>
<body>
  <header class="shell-top">
    <div>
      <div class="shell-brand">ARENA <em>ARCADE</em> · CATÁLOGO</div>
      <p class="shell-sub">25 identidades autorais para fliperama online KOF 2002. Veja login, registro, vitrine, salas, clãs e admin no mesmo tema — escolha o base fixo da empresa.</p>
    </div>
    <div class="shell-actions">
      <a class="btn" href="/">Lobby</a>
      <button type="button" class="btn" id="btnClear">Limpar</button>
      <button type="button" class="btn primary" id="btnApply" disabled>Confirmar tema base</button>
    </div>
  </header>

  <div class="layout">
    <aside class="rail" id="rail">
      <h2>25 temas</h2>
    </aside>
    <section class="stage-wrap">
      <div class="stage-head">
        <div>
          <h1 id="title">—</h1>
          <p id="pitch">—</p>
        </div>
        <div class="surfaces" id="surfaces"></div>
      </div>
      <div class="preview-frame">
        <div class="preview-chrome">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span id="urlBar" style="margin-left:8px;color:#888">arena.arcade / …</span>
        </div>
        <div class="preview-body" id="preview"></div>
      </div>
      <div class="meta-bar">
        <div class="meta-card"><b>Família</b><span id="metaFamily">—</span></div>

  applyVars(pv, theme);
  if (!["login", "register"].includes(surface)) pv.append(nav(theme, surface));
  let body;
  if (surface === "login") body = paintAuth(theme, "login");
  else if (surface === "register") body = paintAuth(theme, "register");
  else if (surface === "vitrine") body = paintVitrine(theme);
  else if (surface === "chat") body = paintChat(theme);
  else if (surface === "sala") body = paintSala(theme);
  else if (surface === "criar") body = paintCriar(theme);
  else if (surface === "clas") body = paintClas(theme);
  else if (surface === "admin") body = paintAdmin(theme);
  else body = paintPerfil(theme);
  pv.append(body);
  root.append(pv);
  document.getElementById("urlBar").textContent = "arena.arcade" + (SURFACES.find((s) => s.id === surface)?.path || "");
}

function selectTheme(id) {
  selectedId = id;
  const theme = catalog.themes.find((t) => t.id === id);
  if (!theme) return;
  document.getElementById("title").textContent = theme.name;
  document.getElementById("pitch").textContent = theme.pitch;
  document.getElementById("metaFamily").textContent = theme.family || "—";
  document.getElementById("metaMood").textContent = theme.mood || "—";
  document.getElementById("metaFont").textContent = theme.fonts.display + " / " + theme.fonts.ui;
  document.getElementById("metaId").textContent = theme.id;
  document.getElementById("btnApply").disabled = false;
  localStorage.setItem("arena.theme.preview", id);
  renderRail();
  paintPreview(theme);
}

      class: "theme-item" + (selectedId === t.id ? " on" : ""),
      onClick: () => selectTheme(t.id),
    }, [
      el("div", { class: "n" }, String(i + 1).padStart(2, "0")),
      el("div", {}, [el("div", { class: "nm" }, t.name), el("div", { class: "fm" }, t.family || "")]),
      el("div", { class: "swatch-row" }, [t.colors.bg, t.colors.panel, t.colors.accent, t.colors.accent2].map((c) => el("i", { style: { background: c } }))),
    ]);
    rail.append(item);
  });
}

function renderSurfaces() {
  const box = document.getElementById("surfaces");
  box.innerHTML = "";
  for (const s of SURFACES) {
    box.append(el("button", {
      type: "button",
      class: surface === s.id ? "on" : "",
      onClick: () => {
        surface = s.id;
        renderSurfaces();
        const theme = catalog.themes.find((t) => t.id === selectedId);
        if (theme) paintPreview(theme);
      },
    }, s.label));
  }
}

async function applyTheme() {
  if (!selectedId) return;
  localStorage.setItem("arena.theme", selectedId);
  const token = localStorage.getItem("arenaToken");
  let serverOk = false;
  if (token) {
    try {
      const r = await fetch("/api/admin/theme", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ id: selectedId }),
      });
      serverOk = r.ok;
    } catch {}
  }
  const theme = catalog.themes.find((t) => t.id === selectedId);
  alert(
    "Tema base escolhido: " + theme.name + "\nID: " + selectedId +
    (serverOk
      ? "\n\nAplicado no servidor (admin). Clientes recebem THEME_UPDATED."
      : "\n\nSalvo neste browser. Faça login admin e confirme de novo para gravar no servidor — ou diga no chat o ID que prefere."),
  );
}

const res = await fetch("/themes/themes.json", { cache: "no-store" });
catalog = await res.json();
if (!catalog.themes || catalog.themes.length < 25) {
  document.getElementById("pitch").textContent = "Catálogo incompleto (" + (catalog.themes?.length || 0) + ").";
}
renderSurfaces();
renderRail();
const saved = localStorage.getItem("arena.theme") || localStorage.getItem("arena.theme.preview") || catalog.defaultTheme;
selectTheme(catalog.themes.some((t) => t.id === saved) ? saved : catalog.themes[0].id);

document.getElementById("btnClear").onclick = () => {
  localStorage.removeItem("arena.theme.preview");
  selectTheme(catalog.defaultTheme);
};
document.getElementById("btnApply").onclick = applyTheme;
</script>
</body>
</html>
