# Arena Arcade — nginx reverse proxy config
# Coloque em /etc/nginx/sites-available/arena e faça symlink para sites-enabled
# SSL via Let's Encrypt: certbot --nginx -d seu-dominio.com

upstream arena_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $uri $arena_frame_policy {
    default DENY;
    /emulator.html SAMEORIGIN;
}

# Redirecionar HTTP → HTTPS
server {
    listen 80;
    server_name seu-dominio.com www.seu-dominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seu-dominio.com www.seu-dominio.com;

    # SSL (gerenciado pelo certbot)
    ssl_certificate     /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options $arena_frame_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;

    # Logs
    access_log /var/log/nginx/arena_access.log combined;
    error_log  /var/log/nginx/arena_error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Arquivos estáticos — servir direto pelo nginx (mais rápido)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|wasm)$ {
        root /home/deploy/arcade-rgc-platform/public;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri @node;
    }

    # Admin — restringir por IP se quiser (descomente e edite)
    # location /admin.html {
    #     allow 177.18.0.0/16;   # seu IP fixo
    #     deny all;
    #     proxy_pass http://arena_node;
    # }

    # WebSocket upgrade
    location /ws {
        proxy_pass http://arena_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Tudo mais → Node
    location / {
        proxy_pass http://arena_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    location @node {
        proxy_pass http://arena_node;
    }
}
