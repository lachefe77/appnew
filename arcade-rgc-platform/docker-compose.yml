version: '3.9'

services:
  arena:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-arcade
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database across container restarts
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ENABLE_SIMULATED_FUNDS: '0'
      DB_PATH: /app/data/arena.db
      HMAC_SECRET: ${HMAC_SECRET:-CHANGE_IN_PROD}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@arena.gg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
